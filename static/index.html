<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Grok Bot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/static/style.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: #0a0a0d;
      color: #e0d6c3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Times New Roman", Times, serif;
      display: flex;
      flex-direction: column;
    }
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.5rem;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }
    .message {
      margin: 0.75rem 0;
      padding: 0.6rem 0.85rem;
      border-radius: 12px;
      max-width: 70%;
      line-height: 1.5;
      font-size: 0.95rem;
    }
    .user-msg {
      background: #1e1e2e;
      margin-left: auto;
      border-bottom-right-radius: 4px;
    }
    .bot-msg {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      margin-right: auto;
      border-bottom-left-radius: 4px;
    }
    .typing-indicator {
      color: #888;
      font-style: italic;
      margin: 0.5rem 0;
    }
    #input-form {
      display: flex;
      padding: 1rem 1.5rem;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
      border-top: 1px solid #222;
      background: #0a0a0a;
    }
    #msgInput {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #333;
      border-radius: 10px;
      background: #111;
      color: #e0d6c3;
      font-size: 0.95rem;
      outline: none;
      font-family: inherit;
    }
    #msgInput:focus {
      border-color: #4a90ff;
    }
    #sendButton {
      background: #4a90ff;
      color: white;
      border: none;
      margin-left: 10px;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
      font-weight: 500;
    }
    #sendButton:hover {
      background: #3a7fe0;
    }
    #header {
      padding: 0.75rem 1.5rem;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    #header-logo {
      font-size: 1.4rem;
      font-weight: 700;
      color: #4a90ff;
    }
    #header-title {
      font-size: 1.1rem;
      color: #e0d6c3;
    }
  </style>
</head>
<body>

  <div id="header">
    <div id="header-logo">🚀</div>
    <div id="header-title">Grok Bot</div>
  </div>

  <div id="chat-container"></div>

  <form id="input-form">
    <input id="msgInput" placeholder="Ask me anything..." autocomplete="off" />
    <button id="sendButton" type="submit" title="Send">Send</button>
  </form>

  <script>
    const chatContainer = document.getElementById("chat-container");
    const form = document.getElementById("input-form");
    const input = document.getElementById("msgInput");

    function scrollToBottom() {
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function addMessage(content, isUser) {
      const msgDiv = document.createElement("div");
      msgDiv.className = "message " + (isUser ? "user-msg" : "bot-msg");
      msgDiv.textContent = content;
      chatContainer.appendChild(msgDiv);
      scrollToBottom();
    }

    const history = [];

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const q = input.value.trim();
      if (!q) return;

      addMessage(q, true);
      history.push({ role: "user", content: q });
      input.value = "";
      input.disabled = true;

      const typingIndicator = document.createElement("div");
      typingIndicator.className = "typing-indicator";
      typingIndicator.textContent = "Grok is thinking...";
      chatContainer.appendChild(typingIndicator);
      scrollToBottom();

      try {
        const r = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: q, history: history.slice(0, -1) })
        });
        const data = await r.json();
        typingIndicator.remove();

        if (data.error) {
          addMessage(data.error, false);
        } else {
          addMessage(data.reply, false);
          history.push({ role: "assistant", content: data.reply });
        }
      } catch (err) {
        typingIndicator.remove();
        addMessage("Error: " + err.message, false);
      }

      input.disabled = false;
      input.focus();
    });

    input.focus();
  </script>

</body>
</html>
